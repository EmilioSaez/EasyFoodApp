name: DB migrations

# Tests de migración de la base de datos (SQLDelight): ningún dato del usuario se pierde al migrar. Ver AGENTS.md.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'shared/src/**'
      - 'shared/build.gradle.kts'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/db-migrations.yml'
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de migración (JVM)
        run: >
          ./gradlew :shared:jvmTest
          --tests '*data.migration.*'
          --tests '*MigrationsCompletenessTest'
          --console=plain
