# Proyecto Xcode generado con XcodeGen: `cd iosApp && xcodegen generate` (ver docs/ios.md).
# El .xcodeproj NO se versiona (.gitignore). Esta es la fuente de verdad.
name: iosApp
options:
  bundleIdPrefix: app.luxion
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"       # CFBundleShortVersionString
    CURRENT_PROJECT_VERSION: "1"      # CFBundleVersion
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # Gradle necesita escribir fuera del sandbox de Xcode
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.luxion.fitarchiveapp
        PRODUCT_NAME: EasyFood
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compilar framework Shared (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
